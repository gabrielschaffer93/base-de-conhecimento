name: Supabase keep-alive

# Prevents free-tier project pause after 7 days of inactivity.
# Schedule: daily at 12:00 UTC (09:00 BRT).
on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing repository secrets."
            echo "Create SUPABASE_URL and SUPABASE_ANON_KEY (or VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY) in Settings → Secrets and variables → Actions."
            exit 1
          fi

          SUPABASE_URL="${SUPABASE_URL%/}"

          HTTP_STATUS=$(curl -s -o /tmp/supabase-ping.json -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/categories?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "HTTP status: ${HTTP_STATUS}"
          cat /tmp/supabase-ping.json || true

          case "$HTTP_STATUS" in
            200|206)
              echo "Supabase keep-alive OK."
              ;;
            401|403)
              echo "::error::Invalid SUPABASE_ANON_KEY. Copy the anon public key from Supabase → Project Settings → API."
              exit 1
              ;;
            404)
              echo "::error::SUPABASE_URL may be wrong. Expected: https://YOUR_PROJECT.supabase.co"
              exit 1
              ;;
            000|"")
              echo "::error::Could not reach Supabase. Project may be paused — restore it in the Supabase dashboard."
              exit 1
              ;;
            *)
              echo "::error::Unexpected HTTP status ${HTTP_STATUS}."
              exit 1
              ;;
          esac
